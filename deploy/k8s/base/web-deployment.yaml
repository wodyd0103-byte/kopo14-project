apiVersion: apps/v1
kind: Deployment
metadata:
  name: kopo14-web
  labels:
    app.kubernetes.io/name: kopo14-web
spec:
  # 정적 파일만 내주므로 상태가 없다. 여러 개 띄워도 되고 무중단 배포가 된다.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kopo14-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kopo14-web
    spec:
      containers:
        - name: web
          image: ghcr.io/wodyd0103-byte/kopo14-web:latest
          ports:
            - name: http
              containerPort: 80
          env:
            - name: API_TARGET
              value: http://kopo14-api:3000
          envFrom:
            # 네이버 키. 없으면 가게 검색만 안 되고 나머지는 정상 동작하므로 optional로 둔다.
            - secretRef:
                name: kopo14-naver
                optional: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
