# 바깥에서 들어오는 입구. /api, /naver-api 갈래는 nginx(web)가 알아서 나누므로
# 여기서는 전부 web으로 보내면 된다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kopo14
  labels:
    app.kubernetes.io/name: kopo14-web
spec:
  ingressClassName: nginx
  rules:
    # hosts 파일에 '127.0.0.1 kopo14.local'을 넣었을 때 쓰는 이름
    - host: kopo14.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kopo14-web
                port:
                  name: http
    # hosts를 건드리지 않고 바로 열어 보기 위한 이름.
    # 관리자 권한이 필요 없어서 로컬 확인에는 이쪽이 편하다.
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kopo14-web
                port:
                  name: http
