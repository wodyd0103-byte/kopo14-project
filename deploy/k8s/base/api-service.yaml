# nginx가 이 이름(kopo14-api)으로 찾아온다. Dockerfile의 API_TARGET 기본값과 같아야 한다.
apiVersion: v1
kind: Service
metadata:
  name: kopo14-api
  labels:
    app.kubernetes.io/name: kopo14-api
spec:
  selector:
    app.kubernetes.io/name: kopo14-api
  ports:
    - name: http
      port: 3000
      targetPort: http
