# 네이버 키는 git에 올리지 않는다. 이 파일은 형태만 보여주는 예시다.
#
# 실제로는 아래 명령으로 클러스터에 직접 만든다 (파일을 만들지 않아도 된다):
#
#   kubectl create namespace kopo14
#   kubectl -n kopo14 create secret generic kopo14-naver \
#     --from-literal=NAVER_CLIENT_ID=발급받은_아이디 \
#     --from-literal=NAVER_CLIENT_SECRET=발급받은_시크릿
#
# git 밖에서 만들었으므로 ArgoCD의 prune 대상이 아니다. 그대로 남는다.
# 키를 넣지 않아도 앱은 뜬다 — 등록 화면의 '가게 검색'만 동작하지 않는다.
apiVersion: v1
kind: Secret
metadata:
  name: kopo14-naver
  namespace: kopo14
type: Opaque
stringData:
  NAVER_CLIENT_ID: ""
  NAVER_CLIENT_SECRET: ""
